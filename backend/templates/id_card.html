<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .id-card { 
            width: 300px; 
            height: 450px; 
            border: 2px solid {{ primary_color | default('#000') }}; 
            border-radius: 15px; 
            padding: 20px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header { background: {{ primary_color | default('#000') }}; color: white; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 13px 13px 0 0; font-weight: bold; font-size: 18px; }
        .photo { width: 120px; height: 120px; background: #eee; border-radius: 50%; margin: 0 auto 15px; overflow: hidden; border: 3px solid {{ primary_color | default('#000') }}; }
        .photo img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 22px; font-weight: bold; margin: 10px 0 5px; color: #333; }
        .role { font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .qr-code { margin-top: 20px; }
        .qr-code img { width: 100px; height: 100px; }
        .footer { font-size: 10px; color: #999; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="id-card">
        <div class="header">{{ institution_name }}</div>
        
        <div class="photo">
            <!-- Simulated Photo -->
            <div style="width: 100%; height: 100%; background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white;">👤</div>
        </div>
        
        <div class="name">{{ user.first_name }} {{ user.last_name }}</div>
        <div class="role">{{ role_name }}</div>
        <div style="font-family: monospace; color: #555;">ID: {{ user.username }}</div>
        
        <div class="qr-code">
            <img src="data:image/svg+xml;base64,{{ qr_base64 }}" alt="QR Code" />
        </div>
        
        <div class="footer">Property of {{ institution_name }}</div>
    </div>
</body>
</html>
