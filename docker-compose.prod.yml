version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clgerp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clgerp_password}
      POSTGRES_DB: ${POSTGRES_DB:-clgerp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clgerp_user -d clgerp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clgerp_user}:${POSTGRES_PASSWORD:-clgerp_password}@db:5432/${POSTGRES_DB:-clgerp_db}
      - REDIS_URL=redis://cache:6379
      - INSTITUTION_NAME=Global Tech University
      - ID_PREFIX=GTU
      - TIMEZONE=UTC
    volumes:
      - backend_uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  celery_worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    restart: always
    command: celery -A core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clgerp_user}:${POSTGRES_PASSWORD:-clgerp_password}@db:5432/${POSTGRES_DB:-clgerp_db}
      - REDIS_URL=redis://cache:6379
      - INSTITUTION_NAME=Global Tech University
      - ID_PREFIX=GTU
      - TIMEZONE=UTC
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-demo.clgerp.com}/api
      - NEXT_PUBLIC_INSTITUTION_NAME=Global Tech University
      - NEXT_PUBLIC_PRIMARY_COLOR=#10b981
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      - backend

  nginx:
    image: ghcr.io/${GITHUB_REPOSITORY}/nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
