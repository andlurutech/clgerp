events {
    worker_connections 2048;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Force SSL Redirection
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _; # Bind dynamically in deployment

        # SSL Configuration (Let's Encrypt Bindings)
        ssl_certificate /etc/letsencrypt/live/demo.clgerp.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/demo.clgerp.com/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Enterprise Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https:;" always;

        # Shared Proxy Headers for Rate Limiting Trust
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Backend API Proxy
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
        }

        location /docs {
            proxy_pass http://backend/docs;
        }
        
        location /openapi.json {
            proxy_pass http://backend/openapi.json;
        }

        # WebSocket Proxy
        location /ws/ {
            rewrite ^/api/ws/(.*) /ws/$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400; # Keep WS tunnels alive
        }

        # Frontend Application Proxy
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }
}
